[accessibility]
ui_scale = 1.2

[bar.default]
start = [ "launcher", "workspaces", "active_window", "spacer_1"]
center = [ "clock"]
end = [ "notifications",  "media", "group:g1", "spacer_1", "tray", "network", "volume", "battery", "session" ]
concave_edge_corners = true
margin_edge = 0
margin_ends = 0
radius_bottom_left = 12
radius_bottom_right = 12
radius_top_left = 0
radius_top_right = 0
scale = 1.10
thickness = 35

    [[bar.default.capsule_group]]
    border = ""
    fill = "on_secondary"
    id = "g1"
    members = [ "temp", "sysmon_2", "sysmon_3" ]
    opacity = 1.0
    padding = 6.0

[shell]
clipboard_image_action_command = "satty -f -"
launch_apps_as_systemd_services = true
polkit_agent = true
settings_show_advanced = true

    [shell.greeter_sync]
    auto_sync = true

    [shell.panel]
    open_near_click_control_center = true
    session_placement = "floating"
    session_position = "center"

    [shell.screenshot]
    copy_to_clipboard = false
    pipe_command = "satty -f -"
    pipe_to_command = true
    save_to_file = false

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "4"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "5"
    variant = "destructive"

[system.monitor]
gpu_poll_seconds = 2

[lockscreen]
lock_before_suspend = true

[idle]
behavior_order = [ "lock", "screen-off", "suspend" ]

    [idle.behavior.lock]
    enabled = true
    timeout = 300
    action = "lock"

    [idle.behavior.screen-off]
    enabled = true
    timeout = 360
    action = "screen_off"

    [idle.behavior.suspend]
    enabled = true
    timeout = 900
    action = "command"
    command = "test \"$(cat /sys/class/power_supply/AC/online 2>/dev/null)\" != 1 && noctalia msg session lock-and-suspend"

[theme]
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-tonal-spot"

    [theme.templates]
    builtin_ids = [ "btop", "gtk3", "gtk4", "hyprland", "kcolorscheme", "kitty", "qt", "alacritty" ]

[wallpaper]
directory = "/usr/share/wallpapers/cachyos-wallpapers"

[hooks]
colors_changed = [ "hyprctl reload", "noctalia msg templates-apply" ]

[widget.clock]
color = "secondary"
format = "{:%H:%M   %d/%m/%y}"

[widget.launcher]
color = "secondary"

[widget.media]
hide_when_no_media = true
title_scroll = "on_hover"

[widget.network]
color = "secondary"

[widget.notifications]
color = "secondary"

[widget.session]
color = "error"

[widget.spacer_1]
type = "spacer"

[widget.temp]
type = "sysmon"
stat = "cpu_temp"
show_value = false

[widget.sysmon_2]
glyph = "gpu-usage"
show_value = false
stat = "gpu_temp"
type = "sysmon"

[widget.sysmon_3]
glyph = "cpu-2"
show_value = false
stat = "ram_used"
type = "sysmon"

[widget.tray]
capsule = true
capsule_fill = "on_secondary"

[widget.battery]
hide_when_plugged = true

[widget.volume]
color = "secondary"
show_label = false

[widget.workspaces]
active_pill_size = 2.5
capsule = true
capsule_fill = "on_primary"
show_labels = false
inactive_pill_size = 1.0
pill_scale = 0.80
