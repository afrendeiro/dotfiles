# v4l2loopback device for the IPU7 camera relay (browsers/desktop apps see a
# normal webcam at /dev/video33). No exclusive_caps: the device must advertise
# capture caps even while idle so consumers can open it and the watchdog
# (ipu7-camera-watch.service) starts the relay on demand. See
# notes/camera-ipu7.md.
options v4l2loopback video_nr=33 card_label=IPU7-Camera
