# v4l2loopback device for the IPU7 camera relay (browsers/desktop apps see a
# normal webcam at /dev/video33). exclusive_caps=1 is REQUIRED: Chromium's
# V4L2 factory skips any device advertising both CAPTURE and OUTPUT caps
# (assumed memory-to-memory, crbug.com/139356) — without it Brave sees no
# cameras. With exclusive_caps, the loopback advertises CAPTURE while a
# producer is attached (ipu7-camera-proxy always streams, so it is always
# listable) and OUTPUT when idle. See notes/camera-ipu7.md.
options v4l2loopback video_nr=33 card_label=IPU7-Camera exclusive_caps=1
