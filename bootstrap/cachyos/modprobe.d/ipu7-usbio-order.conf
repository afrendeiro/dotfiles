# Ensure the USBIO I2C/GPIO bridges and the out-of-tree Intel CVS driver
# (intel/vision-drivers, needed for the IPU7 camera sensor enumeration) are
# loaded before the in-tree IPU7 driver probes.
# See notes/camera-ipu7.md.
softdep intel_ipu7 pre: usbio gpio_usbio i2c_usbio intel_cvs intel_skl_int3472_discrete
